spring:
  application:
    name: dividend-stream

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dividend_stream}
    username: ${DATABASE_USERNAME:dividend_stream}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema; Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # `caffeine` keeps the app runnable with no external services; set CACHE_TYPE=redis
  # in production. Both are consumed through Spring's CacheManager abstraction.
  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names: stockQuotes,stockSearch,stockDividends
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    redis:
      time-to-live: 5m
      key-prefix: "dividend-stream:"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    # Never leak exception detail or stack traces to clients.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    com.dividendstream: ${LOG_LEVEL:INFO}

dividend-stream:
  jwt:
    # REQUIRED in production. Left blank locally, an ephemeral key is generated at
    # startup (tokens then die with the process, which is the correct dev behaviour).
    secret: ${JWT_SECRET:}
    issuer: dividend-stream
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  cors:
    # Comma-separated. Empty means "no browser origin allowed" (the Android app is
    # not a browser and is unaffected by CORS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  market-data:
    provider: ${MARKET_DATA_PROVIDER:mock}
    quote-cache-ttl: PT5M
  registration:
    # Blank leaves registration open. Set INVITE_CODE to require one.
    invite-code: ${INVITE_CODE:}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:20}
  google:
    # Every OAuth client ID allowed in a token's audience, comma-separated: the Web client ID
    # the phone signs in through, and the desktop client ID. Blank disables Google sign-in.
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    # The one secret here, and the reason the desktop app posts its authorisation code to this
    # server instead of redeeming it itself.
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}
  release:
    # Set LATEST_CLIENT to the version you just published, so clients can tell they are
    # behind. Left blank, /api/app/version reports null and no client is nagged.
    latest-client: ${LATEST_CLIENT:}
    # Only set MINIMUM_CLIENT for a change older clients genuinely cannot survive: it locks
    # them out of their own data until they update.
    minimum-client: ${MINIMUM_CLIENT:}
    # Render publishes the deployed SHA under this name. Other hosts use their own.
    commit: ${RENDER_GIT_COMMIT:}
  dividends:
    backfill-settled-cycles: ${DIVIDEND_BACKFILL:true}
    backfill-window-days: 400
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
